<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenImmune aperture mark">
  <title>OpenImmune</title>
  <defs>
    <linearGradient id="oi-ring" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A2270"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="oi-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#120B22"/>
      <stop offset="1" stop-color="#08060F"/>
    </radialGradient>
    <radialGradient id="oi-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2EEFF"/>
      <stop offset="1" stop-color="#F2EEFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- dark field being looked into -->
  <circle cx="64" cy="64" r="26" fill="url(#oi-core)"/>
  <!-- aperture rings, light brought to the dark -->
  <circle cx="64" cy="64" r="48" stroke="url(#oi-ring)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="64" cy="64" r="36" stroke="#A78BFA" stroke-width="1.6" opacity="0.45"/>
  <circle cx="64" cy="64" r="26" stroke="#7C3AED" stroke-width="1.2" opacity="0.6"/>
  <!-- the rare, bright signal resolving on the ring -->
  <circle cx="64" cy="16" r="10" fill="url(#oi-glow)"/>
  <circle cx="64" cy="16" r="3.4" fill="#F2EEFF"/>
</svg>
